<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Security Roster Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Marcellus&display=swap">
<style id="app-css">
/* Layout: navy masthead with a gold hairline, a tab rail, then one working canvas per tab.
   The roster sheet scrolls sideways inside its own frame with a sticky name column;
   analysis is a two-column card grid that stacks on phones. */
:root{
  --bg:#F2F4F8;
  --surface:#FFFFFF;
  --surface-2:#F6F8FB;
  --line:#DDE3EC;
  --line-2:#C5CFDC;
  --ink:#13233A;
  --ink-2:#44546B;
  --muted:#66768C;
  --brand:#0C2D5B;
  --brand-2:#1F5AA6;
  --brand-ink:#FFFFFF;
  --brand-soft:#E6EDF7;
  --gold:#A87A2E;
  --gold-bright:#C99B4E;
  --gold-soft:#F6EEDD;
  --focus:#1F5AA6;
  --good:#1D7A47;
  --warn:#9A5A00;
  --crit:#B3261E;
  --crit-soft:#FBE3E1;
  --c-off-bg:#FBEFC8; --c-off-fg:#6B5009;
  --c-al-bg:#FADCD9;  --c-al-fg:#A3241D;
  --c-ph-bg:#F8D7EF;  --c-ph-fg:#8B1E74;
  --c-pd-bg:#E7DEF8;  --c-pd-fg:#52329A;
  --c-coff-bg:#D4EEE8; --c-coff-fg:#11604F;
  --c-wo-bg:#DAF1DE;  --c-wo-fg:#1B6A33;
  --c-na-bg:#E8ECF2;  --c-na-fg:#8492A6;
  --c-night:#ECF1FA;
  --s1:#1F5AA6; --s2:#B7791F; --s3:#0F8F7E; --s4:#8B4FA3; --s5:#D2603F;
  --shadow:0 1px 2px rgba(12,45,91,.06),0 10px 28px rgba(12,45,91,.10);
  --font-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --radius:10px;
  --mast-h:72px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#111C2D; --surface-2:#0E1828; --line:#22324A; --line-2:#30445F;
    --ink:#E7EDF5; --ink-2:#B4C1D3; --muted:#8C9BB0;
    --brand:#0A2148; --brand-2:#79A6E6; --brand-ink:#FFFFFF; --brand-soft:#16294A;
    --gold:#D3A85E; --gold-bright:#D9B06A; --gold-soft:#2E2617; --focus:#8DB4EC;
    --good:#56C68B; --warn:#E3A43B; --crit:#F0726A; --crit-soft:#3B1C1C;
    --c-off-bg:#3A3015; --c-off-fg:#F0D488;
    --c-al-bg:#46211F;  --c-al-fg:#FFA8A0;
    --c-ph-bg:#3F1C38;  --c-ph-fg:#F3A8E1;
    --c-pd-bg:#2D244A;  --c-pd-fg:#C9B7F6;
    --c-coff-bg:#14362F; --c-coff-fg:#8ADDC9;
    --c-wo-bg:#173720;  --c-wo-fg:#92DEA6;
    --c-na-bg:#1A2538;  --c-na-fg:#71839A;
    --c-night:#15223A;
    --s1:#4F86D6; --s2:#B8842C; --s3:#1C9481; --s4:#9F6CC0; --s5:#D8694B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C2D; --surface-2:#0E1828; --line:#22324A; --line-2:#30445F;
  --ink:#E7EDF5; --ink-2:#B4C1D3; --muted:#8C9BB0;
  --brand:#0A2148; --brand-2:#79A6E6; --brand-ink:#FFFFFF; --brand-soft:#16294A;
  --gold:#D3A85E; --gold-bright:#D9B06A; --gold-soft:#2E2617; --focus:#8DB4EC;
  --good:#56C68B; --warn:#E3A43B; --crit:#F0726A; --crit-soft:#3B1C1C;
  --c-off-bg:#3A3015; --c-off-fg:#F0D488;
  --c-al-bg:#46211F;  --c-al-fg:#FFA8A0;
  --c-ph-bg:#3F1C38;  --c-ph-fg:#F3A8E1;
  --c-pd-bg:#2D244A;  --c-pd-fg:#C9B7F6;
  --c-coff-bg:#14362F; --c-coff-fg:#8ADDC9;
  --c-wo-bg:#173720;  --c-wo-fg:#92DEA6;
  --c-na-bg:#1A2538;  --c-na-fg:#71839A;
  --c-night:#15223A;
  --s1:#4F86D6; --s2:#B8842C; --s3:#1C9481; --s4:#9F6CC0; --s5:#D8694B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:400 22px/1.2 var(--font-display);letter-spacing:.01em}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.ar{font-family:var(--font-ar);direction:rtl}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--brand-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.lg{min-height:44px;padding:0 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--brand-2)}
.icon-btn svg{width:18px;height:18px}
label.field{display:grid;gap:6px;font-weight:500;color:var(--ink-2);font-size:13px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{min-height:38px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--brand-2);flex:none}
.form-error{color:var(--crit);font-size:13px;font-weight:500}
.form-ok{color:var(--good);font-size:13px;font-weight:500}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:
  radial-gradient(1200px 500px at 15% -10%,var(--brand-soft),transparent 60%),var(--bg)}
.login-card{width:min(880px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.login-brand{background:#0C2D5B;color:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:14px;position:relative}
.login-brand::after{content:"";position:absolute;left:32px;right:32px;bottom:26px;height:1px;background:linear-gradient(90deg,#C99B4E,transparent)}
.login-brand .mark{width:52px;height:52px}
.login-brand .eyebrow{color:#E2C48F}
.login-brand h1{font:400 34px/1.1 var(--font-display)}
.login-brand p{color:#C9D6EA;max-width:34ch}
.login-facts{display:flex;gap:24px;margin:10px 0 24px;flex-wrap:wrap}
.login-facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FB3D1}
.login-facts dd{margin:2px 0 0;font:400 20px/1.2 var(--font-display);color:#fff}
.login-form{padding:36px 32px;display:grid;gap:12px;align-content:start}
.login-form h2{margin-bottom:6px}
.pw{display:flex;gap:6px}
.pw button{flex:none}
.credit{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* ---------- masthead & tabs ---------- */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-ink);border-bottom:2px solid var(--gold-bright)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--mast-h);padding-block:6px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:36px;height:36px;flex:none}
.logo-plate{display:inline-grid;place-items:center;flex:none;background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.logo-plate img{display:block;height:50px;width:auto;max-width:none}
.logo-plate.lg{align-self:flex-start;padding:10px 16px;border-radius:12px}
.logo-plate.lg img{height:96px}
.logo-plate.framed{box-shadow:none;border:1px solid var(--line);padding:10px 16px}
.logo-plate.framed img{height:72px}
.brand .divider{width:1px;align-self:stretch;margin-block:8px;background:rgba(255,255,255,.28);flex:none}
.brand b{display:block;font:400 19px/1.15 var(--font-display);letter-spacing:.02em}
.brand span{display:block;font-size:12px;color:#C3D2E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-actions{display:flex;align-items:center;gap:10px;flex:none}
.save-state{font-size:12px;color:#C3D2E8;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:#7FD3A2}
.save-state.dirty .dot{background:#F2C46B}
.mast .btn{min-height:34px;border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
.mast .btn.gold{background:var(--gold-bright);border-color:var(--gold-bright);color:#1A1406}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;font-size:13px;white-space:nowrap}
.user-chip .role{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#E2C48F}
.user-chip button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mast-h) + 2px);z-index:25}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1440px;margin:0 auto}
.tabs-in::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 12px 10px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.main{max-width:1440px;margin:0 auto;padding-block:18px 28px;display:grid;gap:16px}
.view{display:grid;gap:14px;min-width:0}
.foot{max-width:1440px;margin:0 auto;padding-block:8px 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner{max-width:1440px;margin:12px auto 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px}
.banner p{flex:1 1 260px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head p{color:var(--muted);font-size:13px}
.lead{color:var(--ink-2);max-width:68ch}

/* ---------- roster toolbar ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.periodbar{display:flex;align-items:center;gap:6px;min-width:0}
.periodbar select{width:auto;min-width:170px;font-weight:600}
.tb-right{display:flex;gap:8px;flex-wrap:wrap}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.subbar input{max-width:260px}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.summary b{font-variant-numeric:tabular-nums;color:var(--ink)}
.summary b.crit{color:var(--crit)}
.brushbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.brushbar .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.brushbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--brand-2)}
.chip[aria-pressed="true"]{outline:2px solid var(--brand-2);outline-offset:1px}
.chip.c-off{background:var(--c-off-bg);color:var(--c-off-fg);border-color:transparent}
.chip.c-al{background:var(--c-al-bg);color:var(--c-al-fg);border-color:transparent}
.chip.c-ph{background:var(--c-ph-bg);color:var(--c-ph-fg);border-color:transparent}
.chip.c-pd{background:var(--c-pd-bg);color:var(--c-pd-fg);border-color:transparent}
.chip.c-coff{background:var(--c-coff-bg);color:var(--c-coff-fg);border-color:transparent}
.chip.c-wo{background:var(--c-wo-bg);color:var(--c-wo-fg);border-color:transparent}
.chip.c-na{background:var(--c-na-bg);color:var(--c-na-fg);border-color:transparent}
.brush-hint{font-size:12px;color:var(--brand-2);font-weight:500}

/* ---------- roster grid ---------- */
.grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:calc(100vh - 210px);min-height:280px;-webkit-overflow-scrolling:touch}
table.roster{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.roster th,.roster td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;height:36px}
.roster thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);height:auto;padding:6px 2px;font-weight:600}
.roster .name-col{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;min-width:96px;max-width:120px;padding:0 8px;border-right:1px solid var(--line-2)}
.roster thead .name-col{z-index:4;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.roster .d-col{min-width:52px;line-height:1.1}
.roster .d-col .dn{display:block;font-size:15px;color:var(--ink)}
.roster .d-col .dm{font-size:10px;color:var(--muted);font-weight:500}
.roster .d-col .dw{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.roster .d-col.wkend{background:var(--gold-soft)}
.roster .d-col.today{box-shadow:inset 0 3px 0 var(--gold-bright)}
.roster .d-col.today .dw{color:var(--gold);font-weight:700}
.roster .post-col{min-width:76px;padding:0 8px;font-size:12px;color:var(--ink-2);text-align:left;white-space:nowrap}
.roster thead .post-col{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.roster tr.sec-row th,.roster tr.sec-row td{background:var(--brand-soft);height:26px}
.roster tr.sec-row .name-col{background:var(--brand-soft);font:400 13px/1.15 var(--font-display);color:var(--brand-2);letter-spacing:.02em;white-space:normal;padding-block:4px}
.roster tr.sec-row .name-col small{display:block;font:500 10px var(--font-body);color:var(--muted);letter-spacing:0}
.roster td.cnt{font-size:11px;color:var(--ink-2);font-weight:600}
.roster td.cnt.low{color:var(--crit)}
.roster td.cnt.low::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--crit);margin-right:3px;vertical-align:middle}
.roster tr.tot-row th,.roster tr.tot-row td{background:var(--surface-2);font-weight:700;height:30px}
.roster tr.tot-row .name-col{background:var(--surface-2);font-size:12px}
.roster td.today-c{box-shadow:inset 1px 0 0 var(--gold-bright),inset -1px 0 0 var(--gold-bright)}
.name-btn{border:0;background:none;padding:0;font-weight:600;cursor:pointer;color:var(--ink);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:36px}
.name-btn:hover{color:var(--brand-2)}
.cell-in{display:grid;place-items:center;width:100%;height:100%;min-height:35px;border:0;background:transparent;font-size:13px;font-weight:600;padding:0 2px;line-height:1.05}
button.cell-in{cursor:pointer}
button.cell-in:hover{box-shadow:inset 0 0 0 2px var(--brand-2)}
.cell-in small{display:block;font-size:9px;letter-spacing:.06em}
td.c-off{background:var(--c-off-bg);color:var(--c-off-fg)}
td.c-al{background:var(--c-al-bg);color:var(--c-al-fg)}
td.c-ph{background:var(--c-ph-bg);color:var(--c-ph-fg)}
td.c-pd{background:var(--c-pd-bg);color:var(--c-pd-fg)}
td.c-coff{background:var(--c-coff-bg);color:var(--c-coff-fg)}
td.c-wo{background:var(--c-wo-bg);color:var(--c-wo-fg)}
td.c-na{background:repeating-linear-gradient(135deg,var(--c-na-bg) 0 6px,transparent 6px 10px);color:var(--c-na-fg)}
td.c-night{background:var(--c-night);color:var(--brand-2)}
td.c-off .cell-in,td.c-al .cell-in,td.c-ph .cell-in,td.c-pd .cell-in,td.c-coff .cell-in{font-size:11px;letter-spacing:.04em}
tr.flash td.cell{animation:flash .6s ease}
@keyframes flash{from{filter:brightness(1.15)}to{filter:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-2);align-items:center}
.legend .sw{display:inline-grid;place-items:center;min-width:34px;height:20px;border-radius:5px;font-size:10px;font-weight:700;margin-right:6px;padding:0 4px}
.legend .sw.c-off{background:var(--c-off-bg);color:var(--c-off-fg)}
.legend .sw.c-al{background:var(--c-al-bg);color:var(--c-al-fg)}
.legend .sw.c-ph{background:var(--c-ph-bg);color:var(--c-ph-fg)}
.legend .sw.c-pd{background:var(--c-pd-bg);color:var(--c-pd-fg)}
.legend .sw.c-coff{background:var(--c-coff-bg);color:var(--c-coff-fg)}
.legend .sw.c-wo{background:var(--c-wo-bg);color:var(--c-wo-fg)}
.legend .sw.c-night{background:var(--c-night);color:var(--brand-2)}
.legend .sw.c-na{background:repeating-linear-gradient(135deg,var(--c-na-bg) 0 5px,transparent 5px 8px);border:1px solid var(--line)}
.legend .ar{color:var(--muted);margin-left:4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* ---------- overlay sheets ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(6,16,32,.5)}
.sheet{position:relative;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.wide{width:min(980px,100%)}
@media (min-width:720px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{font:400 22px/1.2 var(--font-display)}
.sheet-head .sub{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.pill.c-off{background:var(--c-off-bg);color:var(--c-off-fg);border-color:transparent}
.pill.c-al{background:var(--c-al-bg);color:var(--c-al-fg);border-color:transparent}
.pill.c-ph{background:var(--c-ph-bg);color:var(--c-ph-fg);border-color:transparent}
.pill.c-pd{background:var(--c-pd-bg);color:var(--c-pd-fg);border-color:transparent}
.pill.c-coff{background:var(--c-coff-bg);color:var(--c-coff-fg);border-color:transparent}
.pill.c-wo{background:var(--c-wo-bg);color:var(--c-wo-fg);border-color:transparent}
.pill.c-night{background:var(--c-night);color:var(--brand-2);border-color:transparent}
.pill.c-na{color:var(--muted)}
.sheet-body{padding:14px 18px;overflow:auto;display:grid;gap:12px}
.sheet-body .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet-body .chip{padding:8px 14px;font-size:14px}
.other-time{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.other-time select{width:auto}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.chk input{accent-color:var(--brand-2)}
.person-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.person-day{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:2px}
.person-day .d{font-size:11px;color:var(--muted)}
.person-day .v{font-weight:700;font-size:14px}
.person-day.c-off{background:var(--c-off-bg);color:var(--c-off-fg);border-color:transparent}
.person-day.c-al{background:var(--c-al-bg);color:var(--c-al-fg);border-color:transparent}
.person-day.c-ph{background:var(--c-ph-bg);color:var(--c-ph-fg);border-color:transparent}
.person-day.c-pd{background:var(--c-pd-bg);color:var(--c-pd-fg);border-color:transparent}
.person-day.c-coff{background:var(--c-coff-bg);color:var(--c-coff-fg);border-color:transparent}
.person-day.c-wo{background:var(--c-wo-bg);color:var(--c-wo-fg);border-color:transparent}
.person-day.c-night{background:var(--c-night)}
.person-day.today{outline:2px solid var(--gold-bright)}
.person-day.c-off .d,.person-day.c-al .d,.person-day.c-ph .d,.person-day.c-pd .d,.person-day.c-coff .d,.person-day.c-wo .d{color:inherit;opacity:.8}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.stat-row b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;place-items:center;min-height:200px}
.preview img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.note{font-size:13px;color:var(--ink-2);background:var(--brand-soft);border-radius:8px;padding:10px 12px}

/* ---------- toast & tooltip ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#13233A;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:13px}
.toast button{border:0;background:none;color:#F2C46B;font-weight:700;cursor:pointer;padding:4px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);max-width:240px;line-height:1.4}
.tip b{font-variant-numeric:tabular-nums}
.tip .row{display:flex;justify-content:space-between;gap:12px}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- distribute ---------- */
.seg{justify-self:start;display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.form-row > *{flex:1 1 180px}
.form-row > .btn{flex:0 0 auto}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px;align-content:start}
.sec-card h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:400 17px/1.2 var(--font-display);color:var(--brand-2)}
.sec-card h3 span{font:500 12px var(--font-body);color:var(--muted)}
.sec-card .hint{font-size:12px;color:var(--muted)}
.days-pick{display:flex;gap:4px;flex-wrap:wrap}
.days-pick button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer}
.days-pick button[aria-pressed="true"]{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.result{border-left:3px solid var(--good);background:var(--surface-2);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.result.has-gaps{border-left-color:var(--warn)}
.result ul{margin:0;padding-left:18px}

/* ---------- analysis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:2px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:400 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}
.kpi.alert .v{color:var(--crit)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.charts .span2{grid-column:1/-1}
.chart-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:500 11px var(--font-body);font-variant-numeric:tabular-nums}
.chart text.val{fill:var(--ink);font-weight:600}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .hl,.chart .hit:hover{fill:rgba(31,90,166,.06)}
.gap-table{width:100%;border-collapse:collapse;font-size:13px}
.gap-table th,.gap-table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.gap-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gap-table td.num{font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.crit{color:var(--crit)}
.status.good{color:var(--good)}

/* ---------- staff & settings ---------- */
.tbl-wrap{overflow-x:auto}
.staff-table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.staff-table th,.staff-table td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.staff-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.staff-table td.acts{white-space:nowrap;text-align:right}
.staff-table input,.staff-table select{min-height:34px;padding:5px 8px}
.rules-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules-list li{display:flex;gap:10px;align-items:flex-start;direction:rtl;font-family:var(--font-ar);font-size:15px;line-height:1.6}
.rules-list .n{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--brand-soft);color:var(--brand-2);font:600 13px var(--font-body)}
.rules-list textarea{font-family:var(--font-ar);direction:rtl;min-height:44px}
.rules-list .del{flex:none}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

@media (max-width:860px){
  .charts,.settings-grid{grid-template-columns:minmax(0,1fr)}
  .login-card{grid-template-columns:1fr}
  .login-brand{padding:26px 24px}
  .login-brand h1{font-size:28px}
  .login-form{padding:24px}
}
@media (max-width:560px){
  :root{--mast-h:62px}
  .logo-plate img{height:40px}
  .logo-plate{padding:3px 6px}
  .logo-plate.lg img{height:72px}
  .brand{gap:10px}
  .brand .divider{display:none}
  .brand b{font-size:16px}
  .brand span{display:none}
  .save-state .txt{display:none}
  .user-chip .nm{display:none}
  .tb-right .btn .t{display:none}
  .tb-right .btn{padding:0 10px}
  .periodbar select{min-width:0;flex:1}
  .periodbar{flex:1 1 100%}
  .tb-right{margin-left:auto}
  .subbar input{max-width:none}
  .roster .name-col{min-width:84px;max-width:96px;padding:0 6px}
  .roster .d-col{min-width:46px}
  .grid-wrap{max-height:calc(100vh - 250px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  #print-area img{display:block;width:100%;height:auto;max-height:196mm;object-fit:contain;box-shadow:none}
  @page{size:A4 landscape;margin:6mm}
}

const K256 = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  const ror = (x, n) => (x >>> n) | (x << (32 - n));

    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const a = W[t - 15], b = W[t - 2];

    }

const TIME_RE = /^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m?\.?$/i;

  const m = TIME_RE.exec(String(t || '').trim()); if (!m) return null;

/* ================= auto-distribution ================= */
function staffTimes(s) {
  const list = String(s.shift || '').split(/[,;]+/).map(t => t.trim()).filter(Boolean).map(normTime);
  return list.length ? list : ['9am'];
}
function distribute(p, opts) {
  const n = p.days, startAbs = absDay(p.start), dates = periodDates(p);
  const result = { gaps: [], filled: 0 };
  for (const sec of S.sections) {
    const members = S.staff.filter(s => s.active !== false && s.section === sec.id);
    if (!members.length) continue;
    const need = clamp(+sec.need || 0, 0, members.length);
    const keep = {}, avail = {}, off = {};
    members.forEach(s => {
      const row = ensureRow(p, s.id);
      keep[s.id] = row.map(v => { const x = pv(v); return (x.kind === 'leave' && opts.keepLeave) || (opts.keepEntered && x.kind !== 'none'); });
      avail[s.id] = keep[s.id].map(k => !k);
      off[s.id] = Array(n).fill(false);
    });
    if (sec.mode === 'fixed') {
      const fx = (sec.fixedOff || []).map(Number);
      members.forEach(s => dates.forEach((dt, d) => { if (avail[s.id][d] && fx.includes(weekday(dt))) off[s.id][d] = true; }));
    } else if (sec.mode === 'cover') {
      const k = members.length, turn = clamp(+sec.turn || 4, 1, 14), want = Math.max(1, need);
      for (let d = 0; d < n; d++) {
        const slot = Math.floor((startAbs + d) / turn), picked = [];
        for (let j = 0; j < k && picked.length < want; j++) {
          const s = members[(slot * want + j) % k];
          if (avail[s.id][d]) picked.push(s.id);
        }
        members.forEach(s => { if (avail[s.id][d] && !picked.includes(s.id)) off[s.id][d] = true; });
      }
    } else {
      const perWeek = clamp(+sec.offsPerWeek || 0, 0, 5), blockLen = perWeek >= 2 ? 2 : 1;
      const onDuty = Array(n).fill(0);
      members.forEach(s => avail[s.id].forEach((a, d) => { if (a) onDuty[d]++; }));
      const pref = {};
      members.forEach((s, i) => { pref[s.id] = Math.round(i * 7 / members.length) % 7; });
      const order = members.slice().sort((a, b) => avail[a.id].filter(Boolean).length - avail[b.id].filter(Boolean).length);
      for (const s of order) {
        const availDays = avail[s.id].filter(Boolean).length;
        let q = Math.round(perWeek * availDays / 7);
        const placed = [];
        while (q > 0) {
          const len = Math.min(blockLen, q);
          let best = null;
          for (let st = 0; st + len <= n; st++) {
            let ok = true, surplus = 0;
            for (let d = st; d < st + len; d++) {
              if (!avail[s.id][d] || off[s.id][d]) { ok = false; break; }
              surplus += onDuty[d] - need;
            }
            if (!ok) continue;
            let score = Math.min(surplus, len * 2) * 10 + (surplus < 0 ? surplus * 40 : 0);
            if (placed.length) {
              const gap = Math.min(...placed.map(x => Math.abs(st - x)));
              score -= Math.abs(gap - 7) * 4;
              if (gap <= len) score -= 60;
            } else {
              const want = ((pref[s.id] - (startAbs % 7)) % 7 + 7) % 7;
              score -= Math.min(Math.abs(st - want), Math.abs(st - want - 7), Math.abs(st - want + 7)) * 3;
            }
            if (!best || score > best.score) best = { st, score, len };
          }
          if (!best) break;
          for (let d = best.st; d < best.st + best.len; d++) { off[s.id][d] = true; onDuty[d]--; }
          placed.push(best.st); q -= best.len;
        }
      }
    }
    const nightMin = toMin(sec.nightTime || '10pm');
    const nightCount = {}; members.forEach(s => { nightCount[s.id] = 0; });
    for (let d = 0; d < n; d++) {
      const workers = [];
      for (const s of members) {
        if (keep[s.id][d]) { if (toMin(pv(p.cells[s.id][d]).time) === nightMin) nightCount[s.id]++; continue; }
        if (off[s.id][d]) { p.cells[s.id][d] = 'O'; result.filled++; continue; }
        const times = staffTimes(s);
        p.cells[s.id][d] = times[(startAbs + d) % times.length];
        result.filled++;
        workers.push(s);
      }
      if (sec.nightLeader && nightMin != null && workers.length) {
        const has = members.some(s => { const x = pv(p.cells[s.id][d]); return x.kind === 'duty' && x.min === nightMin; });
        if (!has) {
          const pick = workers.slice().sort((a, b) => (nightCount[a.id] - nightCount[b.id]) || ((toMin(staffTimes(b)[0]) || 0) - (toMin(staffTimes(a)[0]) || 0)))[0];
          p.cells[pick.id][d] = normTime(sec.nightTime || '10pm');
          nightCount[pick.id]++;
        } else {
          members.forEach(s => { if (!keep[s.id][d] && pv(p.cells[s.id][d]).min === nightMin) nightCount[s.id]++; });
        }
      }
      const duty = members.filter(s => pv(p.cells[s.id][d]).kind === 'duty').length;
      if (duty < need) result.gaps.push({ date: dates[d], sec: sec.name, have: duty, need });
    }
  }
  return result;
}

/* ================= analysis ================= */
function analyze(p) {
  const dates = periodDates(p), groups = staffBySection(p);
  const daily = dates.map(() => ({}));
  const people = [], times = {}, buckets = { Morning: 0, Afternoon: 0, Evening: 0, Night: 0, Other: 0 };
  const codes = { O: 0, AL: 0, PH: 0, PD: 0, 'C/OFF': 0, WO: 0 };
  const gaps = [];
  let duty = 0, offs = 0, leave = 0, unset = 0;
  for (const g of groups) {
    for (const s of g.members) {
      const row = ensureRow(p, s.id);
      const rec = { id: s.id, name: s.name, sec: g.sec.id, post: s.post, duty: 0, off: 0, leave: 0, none: 0, night: 0 };
      row.forEach((v, d) => {
        const x = pv(v);
        if (x.kind === 'duty') {
          rec.duty++; duty++; daily[d][g.sec.id] = (daily[d][g.sec.id] || 0) + 1;
          if (x.wo) codes.WO++;
          if (isNight(x.min)) rec.night++;
          const key = x.min == null ? (x.time || 'Other') : normTime(x.time);
          if (!times[key]) times[key] = { label: key, min: x.min == null ? 9999 : x.min, n: 0 };
          times[key].n++; buckets[bucket(x.min)]++;
        } else if (x.kind === 'off') { rec.off++; offs++; codes.O++; }
        else if (x.kind === 'leave') { rec.leave++; leave++; codes[x.code]++; }
        else { rec.none++; unset++; }
      });
      people.push(rec);
    }
    const sec = g.sec, need = +sec.need || 0;
    if (need > 0) dates.forEach((dt, d) => { const h = daily[d][sec.id] || 0; if (h < need) gaps.push({ date: dt, sec: sec.name, have: h, need }); });
  }
  const totals = daily.map(o => Object.values(o).reduce((a, b) => a + b, 0));
  const needTotal = groups.reduce((a, g) => a + (+g.sec.need || 0), 0);
  gaps.sort((a, b) => ymdMs(a.date) - ymdMs(b.date));
  const gapDays = new Set(gaps.map(g => g.date)).size;
  return { dates, groups, daily, totals, people, times: Object.values(times).sort((a, b) => a.min - b.min), buckets, codes, gaps, gapDays, duty, offs, leave, unset, needTotal };
}

function fileToLogo(file) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('read'));
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('image'));
      img.onload = () => {
        let h = Math.min(240, img.naturalHeight), w = Math.round(img.naturalWidth * h / img.naturalHeight);
        if (w > 600) { h = Math.round(h * 600 / w); w = 600; }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/png'));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function niceMax(v) { if (v <= 5) return Math.max(1, Math.ceil(v)); const step = v <= 10 ? 2 : v <= 25 ? 5 : 10; return Math.ceil(v / step) * step; }

}

function chartDaily(A, W) {
  const H = 240, m = { l: 30, r: 12, t: 12, b: 38 };

  const max = niceMax(Math.max(A.needTotal, ...A.totals, 1));
  const y = v => m.t + ih - (v / max) * ih, band = iw / n, bw = Math.max(6, Math.min(34, band * 0.62));
  const tick = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10, ticks = [];
  for (let v = 0; v <= max; v += tick) ticks.push(v);

    segs.forEach((sg, k) => {

      s += top ? `<path d="${topRound(x0, y1, bw, h, 4)}" fill="var(--s${(sg.i % 5) + 1})"/>` : `<rect x="${x0}" y="${y1}" width="${bw}" height="${h}" fill="var(--s${(sg.i % 5) + 1})"/>`;
      acc += sg.v;

    const tip = `<b>${esc(fmtShort(dt))}</b>${A.groups.map((g, i) => `<div class="row"><span><i style="background:var(--s${(i % 5) + 1})"></i>${esc(g.sec.name)}</span><b>${A.daily[d][g.sec.id] || 0}</b></div>`).join('')}<div class="row"><span>Total</span><b>${A.totals[d]}</b></div>`;
    s += `<text x="${cx}" y="${H - m.b + 15}" text-anchor="middle" ${short ? 'style="fill:var(--crit);font-weight:700"' : ''}>${x.d}</text><text x="${cx}" y="${H - m.b + 28}" text-anchor="middle" style="font-size:9px">${DAYS[x.w].charAt(0)}</text>`;

}
function chartBars(rows, W) {

  const H = 220, m = { l: 28, r: 8, t: 18, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length;
  const max = niceMax(Math.max(...rows.map(r => r.n), 1)), y = v => m.t + ih - (v / max) * ih;
  const band = iw / n, bw = Math.max(6, Math.min(30, band * 0.6));

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Shifts by start time"><g class="grid">${[0, max / 2, max].map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join('')}</g>`;
  rows.forEach((r, i) => {

    s += `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" data-tip="${esc(r.tip)}"/>`;

}
function chartHBars(rows, W) {

/* ---------- overlays ---------- */
function renderOverlay() {
  const host = $('#overlay'); if (!host) return;
  const m = ui.modal;
  if (!m) { host.innerHTML = ''; host.className = ''; return; }
  host.className = 'overlay';
  let inner = '';
  if (m.type === 'cell') inner = cellSheet(m);
  else if (m.type === 'person') inner = personSheet(m);
  else if (m.type === 'print') inner = printSheetHtml(m);
  else if (m.type === 'confirm') inner = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cf-title"><div class="sheet-head"><h3 id="cf-title">${esc(m.title)}</h3><button class="icon-btn" data-act="close-modal" aria-label="Close">${ICON.close}</button></div><div class="sheet-body"><p>${esc(m.text)}</p></div><div class="sheet-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn ${m.danger ? 'danger' : 'primary'}" data-act="confirm-ok">${esc(m.ok)}</button></div></div>`;
  host.innerHTML = `<div class="backdrop" data-act="close-modal"></div>${inner}`;
  const f = host.querySelector('[data-autofocus]') || host.querySelector('.sheet button, .sheet input');
  if (f && m.focus !== false) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
function cellSheet(m) {

    { name: 'xl/workbook.xml', data: wb },
    { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: 'xl/worksheets/sheet1.xml', data: sheet1 },
    { name: 'xl/worksheets/sheet2.xml', data: sheet2 },
    { name: 'xl/styles.xml', data: st.xml() }
  ];
  if (logoPng) files.push(
    { name: 'xl/worksheets/_rels/sheet1.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>' },
    { name: 'xl/drawings/drawing1.xml', data: drawingXml },
    { name: 'xl/drawings/_rels/drawing1.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.png"/></Relationships>' },
    { name: 'xl/media/image1.png', data: logoPng });
  return zipStore(files);
}

async function offerFile(filename, bytes, mime) {
  const blob = new Blob([bytes], { type: mime });
  if (IN_CLAUDE) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast('Downloads are not available in this view.'); return; }
    try { const r = await dl.save({ filename, data: blob }); if (r && r.status === 'saved') toast('Saved ' + filename + '.'); }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited') toast('Too many downloads at once. Try again in a moment.');
      else toast('This file could not be saved here (' + (c || 'error') + ').');
    }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Downloaded ' + filename + '.');
}
async function exportXlsx() {
  const p = curPeriod(); if (!p) return;
  try { await offerFile(`Security-Roster_${fileStamp(p)}.xlsx`, buildXlsx(p), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }
  catch (e) { toast('The Excel file could not be built: ' + (e && e.message || e)); }
}
async function exportPdf() {
  const p = curPeriod(); if (!p) return;
  toast('Preparing the one-page PDF…');
  try { await offerFile(`Security-Roster_${fileStamp(p)}.pdf`, await buildPdf(p), 'application/pdf'); }
  catch (e) { toast('The PDF could not be built: ' + (e && e.message || e)); }
}
async function openPrint() {
  const p = curPeriod(); if (!p) return;
  openModal({ type: 'print', img: null, focus: false });
  try {
    const cv = await renderSheetCanvas(p);
    if (ui.modal && ui.modal.type === 'print') { ui.modal.img = cv.toDataURL('image/png'); renderOverlay(); }
  } catch (e) { toast('The print preview could not be built.'); }
}
function printNow() {
  const m = ui.modal; if (!m || !m.img) return;
  let area = document.getElementById('print-area');
  if (!area) { area = document.createElement('div'); area.id = 'print-area'; document.body.appendChild(area); }
  area.innerHTML = `<img src="${m.img}" alt="">`;
  const img = area.querySelector('img');
  const go = () => { try { window.print(); } catch (e) { toast('Printing is not available here. Save the PDF and print it.'); } };
  if (img.complete) setTimeout(go, 50); else img.onload = () => setTimeout(go, 50);
}

/* ================= events ================= */
function setCell(sid, d, v) {
  const p = curPeriod(); if (!p) return;
  const row = ensureRow(p, sid);
  if (row[d] === v) return;
  snapshot(); row[d] = v; touch();
}
function applyValue(v) {
  const m = ui.modal; if (!m || m.type !== 'cell') return;
  const isTime = toMin(v) != null;
  const wo = $('#wo-toggle') && $('#wo-toggle').checked;
  setCell(m.s, m.d, isTime && wo ? 'WO/' + v : v);
  const p = curPeriod();
  render();
  if (ui.autoNext && m.d < p.days - 1) { ui.modal = { type: 'cell', s: m.s, d: m.d + 1, focus: false }; }
  else ui.modal = { type: 'cell', s: m.s, d: m.d, focus: false };
  renderOverlay();
}
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !app.contains(t)) return;
  const act = t.dataset.act;
  switch (act) {
    case 'toggle-pw': { const i = $('#lg-pass'); i.type = i.type === 'password' ? 'text' : 'password'; t.textContent = i.type === 'password' ? 'Show' : 'Hide'; break; }
    case 'view-only': ui.session = { u: '', name: 'Guest', role: 'VIEWER' }; ui.loginError = ''; ui.tab = 'roster'; render(); break;
    case 'logout':
      if (isAdmin() && IN_CLAUDE && ui.dirty && !ui.readOnly) { openModal({ type: 'confirm', title: 'Sign out without saving?', text: 'Your unsaved changes stay on this device, and you can restore them the next time you sign in.', ok: 'Sign out', danger: true, run: () => { ui.session = null; ui.brush = null; render(); } }); break; }
      ui.session = null; ui.brush = null; ui.modal = null; render(); break;
    case 'tab': ui.tab = t.dataset.tab; ui.brush = null; ui.modal = null; render(); window.scrollTo(0, 0); break;
    case 'save': save(); break;
    case 'period-step': {
      const list = sortedPeriods(), p = curPeriod(); if (!p) break;
      const i = list.findIndex(x => x.id === p.id) + (+t.dataset.dir);
      if (i >= 0 && i < list.length) { ui.periodId = list[i].id; render(); }
      else toast(+t.dataset.dir > 0 ? (isAdmin() ? 'This is the latest period. Create the next one in Auto-distribute.' : 'This is the latest period.') : 'This is the first period.');
      break;
    }
    case 'brush': { const v = t.dataset.v; ui.brush = ui.brush === v ? null : v; render(); break; }
    case 'undo': undo(); break;
    case 'cell': {
      const sid = t.dataset.s, d = +t.dataset.d;
      if (ui.brush != null) { setCell(sid, d, ui.brush); render(); const tr = $(`tr[data-row="${CSS.escape(sid)}"]`); if (tr) { tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); } }
      else openModal({ type: 'cell', s: sid, d });
      break;
    }
    case 'person': openModal({ type: 'person', s: t.dataset.s }); break;
    case 'goto-staff': ui.modal = null; ui.tab = 'staff'; render(); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': { const m = ui.modal; ui.modal = null; renderOverlay(); if (m && m.run) m.run(); break; }
    case 'set': applyValue(t.dataset.v); break;
    case 'set-other': { const h = $('#ot-h').value, mm = $('#ot-m').value, ap = $('#ot-ap').value; applyValue(normTime(h + (mm !== '00' ? ':' + mm : '') + ap)); break; }
    case 'edit-step': { const m = ui.modal, p = curPeriod(); if (!m || !p) break; const d = clamp(m.d + (+t.dataset.dir), 0, p.days - 1); ui.modal = { type: 'cell', s: m.s, d, focus: false }; renderOverlay(); break; }
    case 'export-xlsx': exportXlsx(); break;
    case 'export-pdf': exportPdf(); break;
    case 'print': openPrint(); break;
    case 'print-now': printNow(); break;
    case 'dist-mode': ui.distMode = t.dataset.mode; render(); break;
    case 'fixed-day': {
      const sec = secById(t.dataset.sec), day = +t.dataset.day; if (!sec) break;
      change(() => { const f = new Set(sec.fixedOff || []); f.has(day) ? f.delete(day) : f.add(day); sec.fixedOff = Array.from(f).sort(); });
      break;
    }
    case 'distribute': runDistribute(); break;
    case 'staff-move': {
      const s = S.staff.find(x => x.id === t.dataset.s); if (!s) break;
      const same = S.staff.filter(x => x.section === s.section && x.active !== false), i = same.indexOf(s), j = i + (+t.dataset.dir);
      if (j < 0 || j >= same.length) break;
      change(() => { const a = S.staff.indexOf(s), b = S.staff.indexOf(same[j]); [S.staff[a], S.staff[b]] = [S.staff[b], S.staff[a]]; });
      break;
    }
    case 'staff-remove': {
      const s = S.staff.find(x => x.id === t.dataset.s); if (!s) break;
      openModal({ type: 'confirm', title: `Remove ${s.name} from the roster?`, text: `${s.name} will not appear in new periods. Shifts already entered stay in earlier periods, and you can put them back later.`, ok: 'Remove', danger: true, run: () => change(() => { s.active = false; }) });
      break;
    }
    case 'staff-restore': { const s = S.staff.find(x => x.id === t.dataset.s); if (s) change(() => { s.active = true; }); break; }
    case 'rule-add': change(() => S.rules.push('')); break;
    case 'rule-del': { const i = +t.dataset.i; change(() => S.rules.splice(i, 1)); break; }
    case 'timing-add': change(() => S.timings.push({ label: 'New duty', time: '' })); break;
    case 'timing-del': { const i = +t.dataset.i; change(() => S.timings.splice(i, 1)); break; }
    case 'user-del': { const u = t.dataset.u; const usr = S.users.find(x => x.u === u); if (!usr) break; openModal({ type: 'confirm', title: `Remove ${usr.name}?`, text: `${usr.name} will no longer be able to sign in as admin.`, ok: 'Remove', danger: true, run: () => change(() => { S.users = S.users.filter(x => x.u !== u); }) }); break; }
    case 'backup': { const stamp = todayYmd(); offerFile(`security-roster-backup-${stamp}.json`, new TextEncoder().encode(JSON.stringify(S, null, 1)), 'application/json'); break; }
    case 'period-delete': {
      const p = curPeriod(); if (!p) break;
      openModal({ type: 'confirm', title: `Delete ${periodLabel(p)}?`, text: 'Every shift in this period will be removed. You can undo this right after.', ok: 'Delete period', danger: true, run: () => { change(() => { S.periods = S.periods.filter(x => x.id !== p.id); ui.periodId = null; }); toast('Period deleted.', { label: 'Undo', fn: undo }); } });
      break;
    }
    case 'draft-restore': if (pendingDraft) { snapshot(); S = pendingDraft; pendingDraft = null; touch(true); render(); toast('Your earlier changes are back. Press Save changes to keep them.'); } break;
    case 'logo-remove': change(() => { S.org.logo = ''; }); toast('Logo removed.', { label: 'Undo', fn: undo }); break;
    case 'draft-discard': pendingDraft = null; LS.del(K_DRAFT); render(); break;
  }
});
app.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'login-form') {
    const u = $('#lg-user').value, pw = $('#lg-pass').value;
    const user = S.users.find(x => x.u === normUser(u));
    if (!u.trim() || !pw) { ui.loginError = 'Enter your user ID and password.'; }
    else if (!user || user.hash !== passHash(u, pw)) { ui.loginError = 'That user ID and password do not match. Check the spelling and try again.'; }
    else { ui.session = { u: user.u, name: user.name, role: user.role || 'ADMIN' }; ui.loginError = ''; ui.tab = 'roster'; }
    render();
    if (ui.loginError) { const i = $('#lg-user'); if (i) { i.value = u; $('#lg-pass').focus(); } }
  } else if (f.id === 'add-staff') {
    const name = $('#ns-name').value.trim(); if (!name) { $('#ns-name').focus(); return; }
    const id = 's' + Date.now().toString(36);
    change(() => S.staff.push({ id, name, section: $('#ns-sec').value, post: $('#ns-post').value.trim(), shift: $('#ns-shift').value.trim() || '9am', active: true }));
    toast(name + ' added to the roster.');
  } else if (f.id === 'pw-form') {
    const me = S.users.find(x => x.u === ui.session.u), msg = $('#pw-msg'), cur = $('#pw-cur').value, nw = $('#pw-new').value;
    msg.hidden = false;
    if (!me || me.hash !== passHash(me.u, cur)) { msg.className = 'form-error'; msg.textContent = 'The current password is not right.'; return; }
    if (nw.length < 6) { msg.className = 'form-error'; msg.textContent = 'Use at least 6 characters for the new password.'; return; }
    change(() => { me.hash = passHash(me.u, nw); }, { render: false });
    $('#pw-cur').value = ''; $('#pw-new').value = '';
    msg.className = 'form-ok'; msg.textContent = IN_CLAUDE ? 'Password changed. Press Save changes to keep it.' : 'Password changed.';
  } else if (f.id === 'user-form') {
    const name = $('#nu-name').value.trim(), pw = $('#nu-pass').value, msg = $('#nu-msg'); msg.hidden = false;
    if (!name || pw.length < 6) { msg.className = 'form-error'; msg.textContent = 'Enter a name and a password of at least 6 characters.'; return; }
    if (S.users.some(x => x.u === normUser(name))) { msg.className = 'form-error'; msg.textContent = 'There is already an admin with that name.'; return; }
    change(() => S.users.push({ u: normUser(name), name, role: 'ADMIN', hash: passHash(name, pw) }));
    toast(name + ' can now sign in as admin.');
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'period-sel') { ui.periodId = t.value; render(); return; }
  if (t.id === 'auto-next') { ui.autoNext = t.checked; return; }
  if (t.id === 'wo-toggle') { if (ui.modal) ui.modal.wo = t.checked; return; }
  if (t.id === 'dist-start') { if (t.value) { ui.distStart = t.value; render(); } return; }
  if (t.id === 'dist-len') { ui.distLen = t.value; render(); return; }
  if (t.id === 'keep-leave') { ui.keepLeave = t.checked; return; }
  if (t.id === 'keep-entered') { ui.keepEntered = t.checked; return; }
  if (t.id === 'logo-file') {
    const file = t.files && t.files[0]; t.value = '';
    if (!file) return;
    fileToLogo(file).then(url => { change(() => { S.org.logo = url; }); toast('Logo updated.'); }).catch(() => toast('That file could not be read as an image. Use a PNG or JPG.'));
    return;
  }
  if (t.id === 'restore-file') {
    const file = t.files && t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const d = parseJSON(rd.result);
      if (!validData(d)) { toast('That file is not a Security Roster backup.'); return; }
      openModal({ type: 'confirm', title: 'Replace the roster with this backup?', text: `The backup holds ${d.staff.length} staff and ${d.periods.length} periods. Everything in the portal now is replaced. You can undo this right after.`, ok: 'Restore backup', danger: true, run: () => { change(() => { S = d; ui.periodId = null; }); toast('Backup restored.', { label: 'Undo', fn: undo }); } });
    };
    rd.readAsText(file); t.value = '';
    return;
  }
  if (t.dataset.sec && t.dataset.field) {
    const sec = secById(t.dataset.sec); if (!sec) return;
    const f = t.dataset.field;
    change(() => { sec[f] = t.type === 'checkbox' ? t.checked : (f === 'mode' ? t.value : +t.value); }, { render: f === 'mode' });
    return;
  }
  if (t.dataset.staff && t.dataset.field) {
    const s = S.staff.find(x => x.id === t.dataset.staff); if (!s) return;
    const f = t.dataset.field, v = t.value.trim();
    if (f === 'name' && !v) { t.value = s.name; return; }
    change(() => { s[f] = f === 'shift' ? v.split(/[,;]+/).map(x => x.trim()).filter(Boolean).map(normTime).join(', ') : v; }, { render: f === 'section' });
    return;
  }
  if (t.dataset.rule != null) { const i = +t.dataset.rule; change(() => { S.rules[i] = t.value.trim(); }, { render: false }); return; }
  if (t.dataset.timing != null) { const i = +t.dataset.timing; change(() => { S.timings[i][t.dataset.field] = t.value.trim(); }, { render: false }); return; }
});
app.addEventListener('input', e => {
  if (e.target.id !== 'staff-filter') return;
  const q = e.target.value.trim().toLowerCase();
  $$('tr[data-row]').forEach(tr => { tr.hidden = !!q && !tr.dataset.name.includes(q); });
});
app.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else hideTip(); });
app.addEventListener('pointerleave', hideTip);
app.addEventListener('pointerdown', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && e.pointerType !== 'mouse') showTip(t, e.clientX, e.clientY); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.modal) closeModal(); else if (ui.brush != null) { ui.brush = null; render(); } }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && isAdmin() && IN_CLAUDE && ui.dirty) { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && isAdmin() && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); undo(); }
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const p = curPeriod(); if (ui.session && ui.tab === 'analysis' && p) drawCharts(p); }, 150); });

/* expose pure functions for testing and the Oracle comparison */
window.HSR = { sha256, passHash, pv, distribute, analyze, buildXlsx, buildPdf, renderSheetCanvas, periodLabel, buildDocument, embedded: EMBEDDED, get data() { return S; } };

render();
})();
